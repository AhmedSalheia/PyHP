name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

jobs:
  python-worker:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-cov "coverage>=7.10" mypy ruff numpy
      - run: python -m ruff format --check python tests/python
      - run: python -m ruff check python tests/python
      - run: python -m mypy
      - run: python -m pytest --cov

  php:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
      - run: python -m pip install pandas numpy
      - if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
        
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pest --coverage --min=80
        env:
          PYHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}

  setup-smoke:
    name: pyhp setup (${{ matrix.os }}, ${{ matrix.installer }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v10.0.1
      - if: matrix.installer == 'pip'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: matrix.installer == 'uv'
        run: php tests/smoke/setup-smoke.php
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - if: matrix.installer == 'pip'
        run: php tests/smoke/setup-smoke.php --no-uv