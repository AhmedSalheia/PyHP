name: Mutation testing

# Slow (tens of minutes), so it doesn't run on every push. Three ways to start it:
# - push a branch named mutation/<anything>: runs on that commit, from any branch
#   (handy before a merge, and the only way before the file is on main);
# - the Actions tab ("Run workflow"), once this file is on the default branch;
# - by itself every Monday (also needs the file on the default branch).
on:
  push:
    branches: ["mutation/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  python-worker:
    name: mutmut (Python worker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "mutmut<3" pytest numpy pandas
      # mutmut exits non-zero when mutants survive; the report below is what matters.
      - run: mutmut run --no-progress || true
      - name: Report
        run: |
          mutmut results | tee mutmut-results.txt
          {
            echo "## mutmut (Python worker)"
            echo '```'
            mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: mutmut-results
          path: mutmut-results.txt
      # Killed (and timed-out) mutants out of all that ran; fails below the minimum.
      - name: Minimum score (85%)
        shell: python
        run: |
          import os, sqlite3, sys
          rows = dict(sqlite3.connect(".mutmut-cache").execute("select status, count(*) from Mutant group by status").fetchall())
          caught = rows.get("ok_killed", 0) + rows.get("ok_suspicious", 0) + rows.get("bad_timeout", 0)
          total = sum(rows.values()) - rows.get("skipped", 0) - rows.get("untested", 0)
          score = 100 * caught / total
          line = f"mutmut score: {score:.1f}% ({caught} of {total} mutants caught; minimum 85%)"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"\n**{line}**\n")
          if score < 85:
              sys.exit("The worker's mutation score is below the minimum.")

  php:
    name: Pest --mutate (PHP library)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.14"
      # The same Python packages as the main CI, so no PHP test is skipped.
      - run: python -m pip install -r requirements-dev.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: pcov
      - run: composer install --no-interaction --no-progress
      # --min fails the job below 90%. `shell: bash` turns on pipefail, so the pipe
      # into tee (which keeps the output for the artifact) doesn't hide that.
      - run: vendor/bin/pest --mutate --everything --parallel --min=90 | tee pest-mutate.txt
        shell: bash
        env:
          PYHP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pest-mutate-results
          path: pest-mutate.txt
