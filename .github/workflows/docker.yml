name: Docker image

# Builds ghcr.io/pyhp-php/pyhp (PHP + Python + uv + Composer) in two variants.
# Pull requests build and test it; main, a weekly rebuild (for security updates
# of the base images) and manual runs also publish it for amd64 and arm64.
on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml", "tests/smoke/**"]
  pull_request:
    paths: ["docker/**", ".github/workflows/docker.yml", "tests/smoke/**"]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pyhp-php/pyhp
  PHP_VERSION: "8.5"

jobs:
  test:
    name: test (${{ matrix.variant }}, ${{ matrix.installer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cli, fpm]
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            VARIANT=${{ matrix.variant }}
          tags: pyhp-test:${{ matrix.variant }}
          load: true
      # The same real-world test CI runs on every OS, inside the image: a Composer
      # project installs PyHP from this checkout, `pyhp setup` builds the venv,
      # a session runs in it, and `pyhp lock` / `setup --exact` work.
      - name: pyhp setup inside the image
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src pyhp-test:${{ matrix.variant }}
          sh -c "git config --global --add safe.directory '*'
          && php tests/smoke/setup-smoke.php ${{ matrix.installer == 'pip' && '--no-uv' || '' }}"

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [cli, fpm]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            VARIANT=${{ matrix.variant }}
          push: true
          tags: |
            ${{ env.IMAGE }}:php${{ env.PHP_VERSION }}-${{ matrix.variant }}
            ${{ env.IMAGE }}:${{ matrix.variant }}
            ${{ matrix.variant == 'cli' && format('{0}:latest', env.IMAGE) || '' }}
